[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amplifier-module-tool-jev-cua"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["amplifier-smart-tool-fast-decisions @ git+https://github.com/michaeljabbour/amplifier-smart-tool-fast-decisions@main"]

[project.entry-points."amplifier.modules"]
tool-jev-cua = "amplifier_module_tool_jev_cua:mount"

[tool.setuptools.packages.find]
include = ["amplifier_module_tool_jev_cua*"]
